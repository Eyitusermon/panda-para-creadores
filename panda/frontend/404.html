<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANDA CASH - Cargando...</title>
  <style>
    body {
      background: #0a0f1d;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 231, 1, 0.2);
      border-top-color: #00e701;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    (function() {
      var rawPath = window.location.pathname.toLowerCase().replace(/\/+$/, '');
      var routes = {
        '/dashboard': '/dashboard_directo.html',
        '/portal': '/portal_directo.html',
        '/recargar': '/recargar.html',
        '/retirar': '/retirar.html',
        '/perfil': '/perfil.html',
        '/misiones': '/misiones.html',
        '/terminos': '/terminos.html',
        '/juegos/slots': '/juegos/slots/jugar_slots.html',
        '/juegos/minas': '/juegos/minas/jugar_minas.html',
        '/juegos/llaves': '/juegos/llaves/jugar_llaves.html',
        '/juegos/rocket': '/juegos/rocket/jugar_rocket.html',
        '/juegos/plinko': '/juegos/plinko/jugar_plinko.html',
        '/juegos/flappy': '/juegos/flappy/jugar_flappy.html'
      };
      
      var dest = routes[rawPath];
      if (!dest) {
        // Chequeo por prefijo
        for (var r in routes) {
          if (rawPath === r || rawPath.indexOf(r) === 0) {
            dest = routes[r];
            break;
          }
        }
      }
      
      if (dest) {
        window.location.replace(dest + window.location.search + window.location.hash);
      } else {
        window.location.replace('/index.html');
      }
    })();
  </script>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p style="color: #8e9bb0; font-size: 0.9rem;">Cargando Panda Cash...</p>
  </div>
</body>
</html>
